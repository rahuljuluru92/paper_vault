<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Paper Vault</title>
    <link rel="preload" href="fonts/caprasimo.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="style.css">
    <link rel="modulepreload" href="splash.js">
  </head>
  <body>
    <main class="splash">
      <div class="splash-top">
        <h1 class="mark">Paper <b>Vault</b></h1>
        <p id="s-crews"></p>
      </div>
      <div id="stage"></div>
      <div class="splash-foot">
        <p><strong id="s-name">Tonight's vault</strong><span id="s-line">In through the door, out with the loot, seen by no one.</span></p>
        <button id="start-btn" class="btn gold" type="button">Case the vault</button>
      </div>
    </main>
    <script src="splash.js" type="module"></script>
  </body>
</html>
